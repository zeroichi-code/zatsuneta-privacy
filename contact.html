<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ - 雑談ネタ帳</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      font-size: 15px;
      line-height: 1.8;
      color: #2c2a30;
      background: #f4f1ea;
      padding: 24px 16px 60px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #26242a;
      margin-bottom: 6px;
    }
    .app-name {
      font-size: 13px;
      color: #87A878;
      font-weight: 600;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 15px;
      font-weight: 700;
      color: #26242a;
      margin: 24px 0 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid #87A878;
    }
    p { margin-bottom: 12px; }
    .contact-item {
      background: #f9f7f4;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .contact-label {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .contact-value {
      font-size: 16px;
      color: #26242a;
      font-weight: 600;
    }
    a { color: #87A878; }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      font-size: 13px;
      color: #87A878;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-name">雑談ネタ帳</div>
    <h1>お問い合わせ</h1>

    <h2>連絡先</h2>
    <p>アプリに関するご質問・ご意見・不具合報告は、以下のメールアドレスまでお送りください。</p>

    <div class="contact-item">
      <div class="contact-label">メールアドレス</div>
      <div class="contact-value">clockworkorange1019@gmail.com</div>
    </div>

    <div class="contact-item">
      <div class="contact-label">デベロッパー</div>
      <div class="contact-value">zeroichi</div>
    </div>

    <h2>対応について</h2>
    <p>お問い合わせへの返信は、内容を確認のうえ数日以内にご連絡いたします。</p>
    <p>なお、ニュースコンテンツは外部サービス（GNews API）から提供されており、個々の記事内容に関するお問い合わせには対応できない場合があります。</p>

    <a class="back-link" href="index.html">← プライバシーポリシーに戻る</a>
  </div>
</body>
</html>
